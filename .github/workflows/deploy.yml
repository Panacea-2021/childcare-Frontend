# CI/CD: build on GitHub Actions → deploy to AWS EC2 (SSH + rsync + PM2)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST              — public IP or DNS of the EC2 instance
#   EC2_USER              — SSH user (e.g. ubuntu, ec2-user)
#   EC2_SSH_KEY           — private key PEM contents (full file)
#
# Optional:
#   EC2_PORT              — SSH port (default: 22)
#
# Optional repository Variable:
#   EC2_APP_PATH          — remote app directory
#                           (default: /home/ubuntu/apps/childcare-frontend)
#
# One-time on EC2 (Amazon Linux / Ubuntu):
#   curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
#   sudo apt-get install -y nodejs   # or use nvm / dnf as appropriate
#   sudo npm i -g pm2
#   mkdir -p ~/apps/childcare-frontend
#   # Security group: allow SSH (22) from GitHub / your IP, and 3001 (or 80/443 via nginx)

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          SSH_PORT="${{ secrets.EC2_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          SSH_PORT="${{ secrets.EC2_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          APP_PATH="${{ vars.EC2_APP_PATH }}"
          APP_PATH="${APP_PATH:-/home/ubuntu/apps/childcare-frontend}"

          RSYNC_SSH="ssh -i ~/.ssh/ec2_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          # Ensure remote directory exists
          $RSYNC_SSH "${EC2_USER}@${EC2_HOST}" "mkdir -p '${APP_PATH}'"

          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/cache/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env*.local' \
            --exclude '.cursor/' \
            --exclude '.commandcode/' \
            --exclude '.tmp-*/' \
            --exclude '*.mp4' \
            --exclude 'tsconfig.tsbuildinfo' \
            ./ "${EC2_USER}@${EC2_HOST}:${APP_PATH}/"

      - name: Install prod deps & restart PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          SSH_PORT="${{ secrets.EC2_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          APP_PATH="${{ vars.EC2_APP_PATH }}"
          APP_PATH="${APP_PATH:-/home/ubuntu/apps/childcare-frontend}"

          ssh -i ~/.ssh/ec2_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${APP_PATH}'
             npm ci --omit=dev
             if ! command -v pm2 >/dev/null 2>&1; then
               echo 'ERROR: pm2 is not installed. Run: sudo npm i -g pm2' >&2
               exit 1
             fi
             pm2 startOrReload ecosystem.config.cjs --update-env
             pm2 save"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key